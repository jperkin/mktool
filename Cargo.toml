[package]
name = "mktool"
description = "General purpose utility to enhance pkgsrc/mk infrastructure"
version = "1.5.11"
authors = ["Jonathan Perkin <jonathan@perkin.org.uk>"]
readme = "README.md"
keywords = ["pkgsrc"]
license = "ISC"
repository = "https://github.com/jperkin/mktool"
homepage = "https://github.com/jperkin/mktool"
documentation = "https://docs.rs/mktool"
rust-version = "1.88"
edition = "2024"

[features]
default = ["webpki-roots"]
native-certs = ["reqwest/native-tls"]
webpki-roots = ["dep:rustls", "dep:rustls-webpki", "dep:webpki-roots", "reqwest/rustls"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
elf = "0.8.0"
glob = "0.3.4"
goblin = "0.10.7"
indicatif = "0.18.6"
pkgsrc = "0.15.0"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "http2"] }
rustls = { version = "0.23", optional = true }
# Enforce the eMudhra intermediate key distrust fix in rustls' verifier.
rustls-webpki = { version = "0.103.16", default-features = false, optional = true }
suppaftp = "12.2.1"
thiserror = "2.0.21"
url = "2.5.8"
walkdir = "2.5.0"
webpki-roots = { version = "1.0.10", optional = true }

[dev-dependencies]
tempfile = "3"
