[package]
name = "mktool"
description = "General purpose utility to enhance pkgsrc/mk infrastructure"
version = "1.5.10"
authors = ["Jonathan Perkin <jonathan@perkin.org.uk>"]
readme = "README.md"
keywords = ["pkgsrc"]
license = "ISC"
repository = "https://github.com/jperkin/mktool"
homepage = "https://github.com/jperkin/mktool"
documentation = "https://docs.rs/mktool"
rust-version = "1.88"
edition = "2024"

[features]
default = ["webpki-roots"]
webpki-roots = ["dep:rustls", "dep:webpki-roots", "reqwest/rustls"]
native-certs = ["reqwest/native-tls"]

[dependencies]
clap = { version = "4", features = ["derive"] }
elf = "0.8.0"
glob = "0.3.4"
goblin = "0.10.7"
indicatif = "0.18.6"
pkgsrc = "0.14.0"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "http2"] }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "1", optional = true }
suppaftp = "10.0.1"
thiserror = "2.0.19"
url = "2.5.8"
walkdir = "2.5.0"
anyhow = "1.0.104"

[dev-dependencies]
tempfile = "3"
